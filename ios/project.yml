# XcodeGen spec — generate RockBlack.xcodeproj with `xcodegen generate` (see README.md).
# The .xcodeproj is not committed; CI regenerates it on every build.
name: RockBlack
options:
  bundleIdPrefix: tech.rockblack
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # Release version of the iOS app (tag ios-vX.Y.Z). CI overrides the build number.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    # libXray is a Go c-archive: Go's net package needs libresolv.
    OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  RockBlack:
    type: application
    platform: iOS
    sources:
      - path: RockBlack
      - path: Shared
    dependencies:
      - target: RockBlackTunnel
        embed: true
        codeSign: true
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.rockblack.app
        PRODUCT_NAME: RockBlack
        INFOPLIST_FILE: RockBlack/Info.plist
        CODE_SIGN_ENTITLEMENTS: RockBlack/RockBlack.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Manual signing in CI passes RB_PROFILE_APP / RB_PROFILE_TUNNEL.
        PROVISIONING_PROFILE_SPECIFIER: "$(RB_PROFILE_APP)"

  RockBlackTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.rockblack.app.tunnel
        PRODUCT_NAME: RockBlackTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/RockBlackTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(RB_PROFILE_TUNNEL)"
        APPLICATION_EXTENSION_API_ONLY: YES

  RockBlackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RockBlackTests
    dependencies:
      - target: RockBlack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.rockblack.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RockBlack.app/RockBlack"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RockBlack:
    build:
      targets:
        RockBlack: all
        RockBlackTunnel: all
    test:
      config: Debug
      targets:
        - RockBlackTests
    archive:
      config: Release
